<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献笔记</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1a;--bg2:#111827;--bg3:#1a2332;--bg4:#1e2d42;
  --border:rgba(50,100,160,0.2);--border2:rgba(50,100,160,0.35);
  --text:#e2eaf8;--text2:#8fa3c0;--text3:#4a6280;
  --accent:#4a9eff;--accent2:#1a3d7a;
  --green:#3ecf8e;--amber:#f5a623;--red:#f06565;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:var(--bg2);} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;overflow:hidden;}

/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-head{padding:16px;border-bottom:1px solid var(--border);}
.sidebar-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;}
.sidebar-sub{font-size:11px;color:var(--text3);font-family:var(--mono);}
.btn-new{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;margin-top:12px;border-radius:6px;background:var(--accent2);border:1px solid var(--accent);color:var(--accent);font-size:13px;font-family:var(--sans);cursor:pointer;transition:all .15s;}
.btn-new:hover{background:var(--accent);color:#fff;}
.search-box{position:relative;margin:10px 16px;}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3);}
.search-box input{width:100%;padding:7px 10px 7px 30px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;font-family:var(--sans);}
.search-box input::placeholder{color:var(--text3);}
.search-box input:focus{border-color:var(--border2);}
.note-list{flex:1;overflow-y:auto;padding:8px;}
.note-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:4px;border:1px solid transparent;}
.note-item:hover{background:var(--bg3);}
.note-item.active{background:var(--bg3);border-color:var(--border2);}
.ni-title{font-size:13px;color:var(--text);font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ni-meta{font-size:10px;color:var(--text3);font-family:var(--mono);display:flex;gap:8px;align-items:center;}
.ni-stars{color:var(--amber);}
.ni-tag{padding:1px 5px;border-radius:3px;font-size:9px;border:1px solid;}
.empty-list{text-align:center;padding:40px 16px;color:var(--text3);font-size:12px;}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;}

/* Empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3);}
.empty-state .icon{font-size:48px;opacity:.3;}
.empty-state p{font-size:13px;}

/* Editor */
.editor{flex:1;display:flex;flex-direction:column;overflow:hidden;display:none;}
.editor.show{display:flex;}
.editor-head{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.editor-head input{flex:1;font-size:18px;font-weight:600;color:var(--text);background:transparent;border:none;outline:none;font-family:var(--sans);}
.editor-head input::placeholder{color:var(--text3);}
.btn-save{padding:7px 18px;border-radius:6px;background:var(--accent2);border:1px solid var(--accent);color:var(--accent);font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap;}
.btn-save:hover{background:var(--accent);color:#fff;}
.btn-delete{padding:7px 12px;border-radius:6px;background:transparent;border:1px solid rgba(240,101,101,.25);color:var(--red);font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .15s;}
.btn-delete:hover{background:rgba(240,101,101,.1);}

.editor-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;}

/* Meta row */
.meta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.meta-item{display:flex;flex-direction:column;gap:3px;}
.meta-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.meta-input{padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;transition:border-color .12s;}
.meta-input:focus{border-color:var(--border2);}
.meta-input::placeholder{color:var(--text3);}

/* Star rating */
.stars{display:flex;gap:4px;cursor:pointer;font-size:20px;}
.star{color:var(--text3);transition:color .12s;}
.star.on{color:var(--amber);}
.star:hover,.star:hover~.star{color:var(--text3);}
.stars:hover .star{color:var(--amber);}
.stars:hover .star:hover~.star{color:var(--text3);}

/* Tag chips */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tag-chip{padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--text3);background:transparent;font-family:var(--sans);transition:all .12s;}
.tag-chip:hover{border-color:var(--border2);color:var(--text2);}
.tag-chip.on{border-color:var(--accent);color:var(--accent);background:rgba(74,158,255,.08);}

/* Note fields */
.field{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px;}
.field-label span{font-size:14px;}
.field textarea{padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--sans);line-height:1.7;outline:none;resize:vertical;min-height:80px;transition:border-color .12s;}
.field textarea:focus{border-color:var(--border2);}
.field textarea::placeholder{color:var(--text3);}

/* Divider */
.divider{height:1px;background:var(--border);margin:2px 0;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text);z-index:999;transform:translateY(60px);opacity:0;transition:all .2s;display:flex;align-items:center;gap:8px;}
.toast.show{transform:none;opacity:1;}
.toast.ok{border-color:rgba(62,207,142,.3);}.toast.ok::before{content:'✓';color:var(--green);}
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">📖 文献笔记</div>
      <div class="sidebar-sub" id="note-count">0 篇笔记</div>
      <button class="btn-new" onclick="newNote()">+ 新建笔记</button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="搜索笔记…" oninput="renderList(this.value)">
    </div>
    <div class="note-list" id="note-list"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <div class="icon">📝</div>
      <p>点击「新建笔记」开始记录第一篇文献</p>
    </div>

    <!-- Editor -->
    <div class="editor" id="editor">
      <div class="editor-head">
        <input type="text" id="f-title" placeholder="文章标题…">
        <button class="btn-delete" onclick="deleteNote()">删除</button>
        <button class="btn-save" onclick="saveNote()">保存 ✓</button>
      </div>
      <div class="editor-body">

        <!-- Meta -->
        <div class="meta-row">
          <div class="meta-item">
            <div class="meta-label">作者</div>
            <input class="meta-input" type="text" id="f-author" placeholder="First Author et al." style="width:160px">
          </div>
          <div class="meta-item">
            <div class="meta-label">期刊</div>
            <input class="meta-input" type="text" id="f-journal" placeholder="Nature Medicine" style="width:150px">
          </div>
          <div class="meta-item">
            <div class="meta-label">年份</div>
            <input class="meta-input" type="text" id="f-year" placeholder="2026" style="width:70px">
          </div>
          <div class="meta-item">
            <div class="meta-label">DOI / 链接</div>
            <input class="meta-input" type="text" id="f-doi" placeholder="https://doi.org/…" style="width:220px">
          </div>
        </div>

        <!-- Tags + Stars -->
        <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;">
          <div class="meta-item">
            <div class="meta-label">领域标签</div>
            <div class="tag-row" id="tag-row">
              <button class="tag-chip" data-tag="AIDD·蛋白设计" onclick="toggleTag(this)">🤖 AIDD·蛋白设计</button>
              <button class="tag-chip" data-tag="TPD" onclick="toggleTag(this)">🔧 TPD</button>
              <button class="tag-chip" data-tag="ADC" onclick="toggleTag(this)">💊 ADC</button>
              <button class="tag-chip" data-tag="纳米抗体" onclick="toggleTag(this)">🧫 纳米抗体</button>
              <button class="tag-chip" data-tag="结构生物学" onclick="toggleTag(this)">🔭 结构生物学</button>
              <button class="tag-chip" data-tag="其他" onclick="toggleTag(this)">📌 其他</button>
            </div>
          </div>
          <div class="meta-item">
            <div class="meta-label">推荐指数</div>
            <div class="stars" id="stars" onclick="setStar(event)">
              <span class="star" data-v="1">★</span>
              <span class="star" data-v="2">★</span>
              <span class="star" data-v="3">★</span>
              <span class="star" data-v="4">★</span>
              <span class="star" data-v="5">★</span>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="field">
          <div class="field-label"><span>🎯</span> 一句话总结</div>
          <textarea id="f-summary" rows="2" placeholder="用一句话概括这篇文章的核心贡献…"></textarea>
        </div>

        <div class="field">
          <div class="field-label"><span>🔬</span> 核心方法 / 技术创新</div>
          <textarea id="f-method" rows="3" placeholder="用了什么技术、模型或策略？与现有方法相比有什么改进？"></textarea>
        </div>

        <div class="field">
          <div class="field-label"><span>📊</span> 关键结果</div>
          <textarea id="f-result" rows="3" placeholder="最重要的实验数据或发现…"></textarea>
        </div>

        <div class="field">
          <div class="field-label"><span>💡</span> 对我研究的启发</div>
          <textarea id="f-inspire" rows="3" placeholder="这篇文章有哪些方法或思路可以借鉴到我的研究中？"></textarea>
        </div>

        <div class="field">
          <div class="field-label"><span>⚠️</span> 局限性 / 不足</div>
          <textarea id="f-limit" rows="2" placeholder="这篇文章的局限性是什么？"></textarea>
        </div>

        <div class="field">
          <div class="field-label"><span>👣</span> 下一步行动</div>
          <textarea id="f-action" rows="2" placeholder="因为这篇文章，我打算做什么？（读引用文献/复现实验/改进方案）"></textarea>
        </div>

      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const STORE = 'lit_notes_v1';
let notes = [];
let currentId = null;
let starVal = 0;

// ── Data ──
function load(){ try{ notes=JSON.parse(localStorage.getItem(STORE)||'[]'); }catch(e){ notes=[]; } }
function save(){ localStorage.setItem(STORE, JSON.stringify(notes)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── List ──
function renderList(q=''){
  const list = document.getElementById('note-list');
  let items = [...notes].sort((a,b)=>b.updatedAt-a.updatedAt);
  if(q) items = items.filter(n=>
    (n.title||'').toLowerCase().includes(q.toLowerCase()) ||
    (n.summary||'').toLowerCase().includes(q.toLowerCase()) ||
    (n.tags||[]).join(' ').toLowerCase().includes(q.toLowerCase())
  );
  document.getElementById('note-count').textContent = notes.length+' 篇笔记';

  const COLORS = {'AIDD·蛋白设计':'#f5a623','TPD':'#26c4b0','ADC':'#9b72e8','纳米抗体':'#4a9eff','结构生物学':'#e8c46a','其他':'#8fa3c0'};

  if(!items.length){
    list.innerHTML='<div class="empty-list">'+(q?'没有匹配的笔记':'还没有笔记')+'</div>';
    return;
  }
  list.innerHTML = items.map(n=>{
    const stars = n.stars ? '★'.repeat(n.stars)+'☆'.repeat(5-n.stars) : '☆☆☆☆☆';
    const tagHTML = (n.tags||[]).slice(0,2).map(t=>`<span class="ni-tag" style="color:${COLORS[t]||'#8fa3c0'};border-color:${COLORS[t]||'#8fa3c0'}40">${t}</span>`).join('');
    const date = n.updatedAt ? new Date(n.updatedAt).toLocaleDateString('zh-CN') : '';
    return `<div class="note-item ${n.id===currentId?'active':''}" onclick="openNote('${n.id}')">
      <div class="ni-title">${n.title||'无标题'}</div>
      <div class="ni-meta">
        <span class="ni-stars">${stars}</span>
        ${tagHTML}
        <span>${date}</span>
      </div>
    </div>`;
  }).join('');
}

// ── Open / New / Delete ──
function openNote(id){
  const n = notes.find(x=>x.id===id);
  if(!n) return;
  currentId = id;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('editor').style.display='flex';
  document.getElementById('f-title').value   = n.title   || '';
  document.getElementById('f-author').value  = n.author  || '';
  document.getElementById('f-journal').value = n.journal || '';
  document.getElementById('f-year').value    = n.year    || '';
  document.getElementById('f-doi').value     = n.doi     || '';
  document.getElementById('f-summary').value = n.summary || '';
  document.getElementById('f-method').value  = n.method  || '';
  document.getElementById('f-result').value  = n.result  || '';
  document.getElementById('f-inspire').value = n.inspire || '';
  document.getElementById('f-limit').value   = n.limit   || '';
  document.getElementById('f-action').value  = n.action  || '';
  // tags
  document.querySelectorAll('.tag-chip').forEach(c=>{ c.classList.toggle('on',(n.tags||[]).includes(c.dataset.tag)); });
  // stars
  starVal = n.stars || 0;
  renderStars();
  renderList();
}

function newNote(){
  const n = { id:uid(), title:'', author:'', journal:'', year:'', doi:'',
    summary:'', method:'', result:'', inspire:'', limit:'', action:'',
    tags:[], stars:0, createdAt:Date.now(), updatedAt:Date.now() };
  notes.unshift(n);
  save();
  openNote(n.id);
  document.getElementById('f-title').focus();
}

function saveNote(){
  const n = notes.find(x=>x.id===currentId);
  if(!n) return;
  n.title   = document.getElementById('f-title').value.trim();
  n.author  = document.getElementById('f-author').value.trim();
  n.journal = document.getElementById('f-journal').value.trim();
  n.year    = document.getElementById('f-year').value.trim();
  n.doi     = document.getElementById('f-doi').value.trim();
  n.summary = document.getElementById('f-summary').value.trim();
  n.method  = document.getElementById('f-method').value.trim();
  n.result  = document.getElementById('f-result').value.trim();
  n.inspire = document.getElementById('f-inspire').value.trim();
  n.limit   = document.getElementById('f-limit').value.trim();
  n.action  = document.getElementById('f-action').value.trim();
  n.tags    = [...document.querySelectorAll('.tag-chip.on')].map(c=>c.dataset.tag);
  n.stars   = starVal;
  n.updatedAt = Date.now();
  save();
  renderList();
  toast('已保存');
}

function deleteNote(){
  if(!currentId) return;
  if(!confirm('确认删除这条笔记？')) return;
  notes = notes.filter(x=>x.id!==currentId);
  save();
  currentId = null;
  document.getElementById('editor').style.display='none';
  document.getElementById('empty-state').style.display='flex';
  renderList();
  toast('已删除');
}

// ── Tags ──
function toggleTag(el){ el.classList.toggle('on'); }

// ── Stars ──
function setStar(e){
  const s = e.target.closest('.star');
  if(!s) return;
  starVal = parseInt(s.dataset.v);
  renderStars();
}
function renderStars(){
  document.querySelectorAll('.star').forEach(s=>{ s.classList.toggle('on',parseInt(s.dataset.v)<=starVal); });
}

// ── Toast ──
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast ok show';
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2000);
}

// ── Keyboard shortcut ──
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); if(currentId) saveNote(); }
});

// ── Init ──
load();
renderList();
</script>
</body>
</html>
